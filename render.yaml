services:
  - type: web
    name: rupiksha-backend-java
    env: docker
    dockerfilePath: ./backend-java/Dockerfile
    dockerContext: ./backend-java
    plan: starter
    region: singapore
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: rupiksha-postgres
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: rupiksha-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rupiksha-postgres
          property: password
      - key: REDIS_HOST
        fromService:
          name: rupiksha-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: rupiksha-redis
          type: redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          name: rupiksha-redis
          type: redis
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://rupiksha-backend-java.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_POOL_MAX
        value: 4
      - key: OTP_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: mock
      - key: RECHARGE_PROVIDER
        value: mock
      - key: AEPS_PROVIDER
        value: mock
      - key: ALLOW_MOCK_PROVIDERS_IN_PRODUCTION
        value: true
      - key: PAYMENT_KEY_ID
        sync: false
      - key: PAYMENT_KEY_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: OTP_API_KEY
        sync: false
      - key: OTP_SENDER_ID
        sync: false
      - key: RECHARGE_BASE_URL
        sync: false
      - key: RECHARGE_API_KEY
        sync: false
      - key: RECHARGE_API_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: LEVIN_AEPS_BASE_URL
        sync: false
      - key: LEVIN_AEPS_API_TOKEN
        sync: false
      - key: LEVIN_AEPS_USER_ID
        sync: false
      - key: LEVIN_AEPS_ENCRYPTION_KEY
        sync: false

  - type: redis
    name: rupiksha-redis
    plan: starter
    region: singapore
    maxmemoryPolicy: allkeys-lru

databases:
  - name: rupiksha-postgres
    databaseName: rupiksha
    user: rupiksha
    region: singapore
    plan: starter
    ipAllowList: []

