    merchant-daily-limit: ${FINGPAY_UPICW_DAILY_LIMIT:30000}



---
# Production profile overrides. Activated with SPRING_PROFILES_ACTIVE=prod.
# All secrets MUST be provided via environment variables - no dev-friendly defaults.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/rupiksha}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    properties:
      hibernate:
        format_sql: false
        show_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: WARN
    com.rupiksha.backend: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: OFF

