services:
  - type: web
    name: rupiksha-backend-java
    env: docker
    dockerfilePath: ./backend-java/Dockerfile
    plan: starter
    region: singapore
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        fromDatabase:
          name: rupiksha-postgres
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: rupiksha-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rupiksha-postgres
          property: password
      - key: REDIS_HOST
        fromService:
          name: rupiksha-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: rupiksha-redis
          type: redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          name: rupiksha-redis
          type: redis
          property: password
      - key: JWT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OTP_PROVIDER
        value: 2factor
      - key: PAYMENT_KEY_ID
        sync: false
      - key: PAYMENT_KEY_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: OTP_API_KEY
        sync: false
      - key: OTP_SENDER_ID
        sync: false
      - key: RECHARGE_BASE_URL
        sync: false
      - key: RECHARGE_API_KEY
        sync: false
      - key: RECHARGE_API_SECRET
        sync: false
      - key: RECHARGE_PROVIDER
        value: paysprint
      - key: SENTRY_DSN
        sync: false
      # Levin AEPS API Credentials (set these in Render Dashboard)
      - key: LEVIN_AEPS_BASE_URL
        sync: false
      - key: LEVIN_AEPS_API_TOKEN
        sync: false
      - key: LEVIN_AEPS_USER_ID
        sync: false
      - key: LEVIN_AEPS_ENCRYPTION_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AEPS_PROVIDER
        value: levin

databases:
  - name: rupiksha-postgres
    databaseName: rupiksha
    user: rupiksha

