<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" width="400" height="300" xmlns="http://www.w3.org/2000/svg">
    <rect width="400" height="300" rx="20" fill="#FFE4E6" />
    <defs>
        
    <filter id="studioShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
        <feOffset dx="0" dy="16" />
        <feComponentTransfer><feFuncA type="linear" slope="0.14" /></feComponentTransfer>
        <feMerge>
            <feMergeNode />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
        </feMerge>
    </filter>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#0F172A" stop-opacity="0.18" />
        <stop offset="60%" stop-color="#0F172A" stop-opacity="0.05" />
        <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    </defs>
    
            <ellipse cx="200" cy="255" rx="115" ry="24" fill="url(#floorShadow)" />
            <!-- Modern Hospital Building -->
            <g filter="url(#studioShadow)">
                <!-- Main Block -->
                <rect x="130" y="80" width="140" height="160" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3" />
                
                <!-- Windows Grid -->
                
                    <rect x="148" y="105" width="24" height="18" rx="4" fill="#38BDF8" opacity="0.8" />
                
                    <rect x="186" y="105" width="24" height="18" rx="4" fill="#38BDF8" opacity="0.8" />
                
                    <rect x="224" y="105" width="24" height="18" rx="4" fill="#38BDF8" opacity="0.8" />
                
                    <rect x="148" y="133" width="24" height="18" rx="4" fill="#38BDF8" opacity="0.8" />
                
                    <rect x="186" y="133" width="24" height="18" rx="4" fill="#38BDF8" opacity="0.8" />
                
                    <rect x="224" y="133" width="24" height="18" rx="4" fill="#38BDF8" opacity="0.8" />
                
                    <rect x="148" y="161" width="24" height="18" rx="4" fill="#38BDF8" opacity="0.8" />
                
                    <rect x="186" y="161" width="24" height="18" rx="4" fill="#38BDF8" opacity="0.8" />
                
                    <rect x="224" y="161" width="24" height="18" rx="4" fill="#38BDF8" opacity="0.8" />
                
                    <rect x="148" y="189" width="24" height="18" rx="4" fill="#38BDF8" opacity="0.8" />
                
                    <rect x="186" y="189" width="24" height="18" rx="4" fill="#38BDF8" opacity="0.8" />
                
                    <rect x="224" y="189" width="24" height="18" rx="4" fill="#38BDF8" opacity="0.8" />
                
                
                <!-- Entrance Doors -->
                <rect x="180" y="200" width="40" height="40" rx="4" fill="#0284C7" />
                <line x1="200" y1="200" x2="200" y2="240" stroke="#FFFFFF" stroke-width="2" />

                <!-- Red Cross Emblem on Top -->
                <circle cx="200" cy="70" r="22" fill="#E11D48" stroke="#FFFFFF" stroke-width="3" />
                <rect x="194" y="56" width="12" height="28" rx="3" fill="#FFFFFF" />
                <rect x="186" y="64" width="28" height="12" rx="3" fill="#FFFFFF" />
            </g>
        
</svg>