name: rupiksha-backend
services:
  - name: rupiksha-backend-java
    type: web
    git:
      repository: github.com/yadavanuj73/rupiksha-frontend
      branch: main
      workdir: backend-java
      dockerfile: Dockerfile
    instance_type: free
    regions:
      - fra
    ports:
      - port: 8080
        protocol: http
    health_checks:
      - path: /actuator/health
        port: 8080
        protocol: http
    env:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_POOL_MAX
        value: "2"
      - key: OTP_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: mock
      - key: RECHARGE_PROVIDER
        value: mock
      # Note: Legacy AEPS_PROVIDER removed. Using Levin AEPS (LEVIN_AEPS_* vars).
      - key: ALLOW_MOCK_PROVIDERS_IN_PRODUCTION
        value: "true"
      # Set these as secrets in Koyeb dashboard:
      # DB_URL        → from Neon.tech PostgreSQL connection string
      # DB_USERNAME   → from Neon.tech
      # DB_PASSWORD   → from Neon.tech
      # REDIS_HOST    → from Upstash Redis
      # REDIS_PORT    → from Upstash Redis
      # REDIS_PASSWORD → from Upstash Redis
      # JWT_SECRET    → any random 32+ char string
      # ADMIN_SEED_PASSWORD → your admin login password
      # CORS_ALLOWED_ORIGINS → your Vercel URL
      # PUBLIC_BASE_URL → your Koyeb service URL
