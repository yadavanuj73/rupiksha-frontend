<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantra Fingerprint Capture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: white; border-radius: 20px; padding: 32px; max-width: 380px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.1); text-align: center; }
  .icon { font-size: 64px; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 800; color: #0f172a; text-transform: uppercase; margin-bottom: 8px; }
  p { font-size: 12px; color: #64748b; margin-bottom: 24px; line-height: 1.6; }
  button { width: 100%; padding: 16px; background: #2563eb; color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; transition: background 0.2s; }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  .status { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 11px; font-weight: 700; }
  .status.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
  .status.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  .status.info { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="icon">👆</div>
  <h1>Fingerprint Capture</h1>
  <p>Place your finger firmly on the Mantra device and press the button below.</p>
  <button id="captureBtn" onclick="captureFingerprint()">Capture Fingerprint</button>
  <div id="status" class="status info" style="display:none"></div>
</div>

<script>
const PORTS = [11100, 11101, 11102, 11103, 11104, 11105, 11106, 11107, 11108, 11109, 11110, 11111, 11112, 11113, 11114, 11115, 11116, 11117, 11118, 11119, 11120];
const XML_BODY = '<?xml version="1.0"?><PidOptions ver="1.0"><Opts fCount="1" fType="2" iCount="0" iType="" pCount="0" pType="" format="0" pidVer="2.0" timeout="10000" posh="UNKNOWN" env="P" wadh="" /><CustOpts><Param name="mantrakey" value="" /></CustOpts></PidOptions>';

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.innerHTML = msg;
  el.className = 'status ' + type;
  el.style.display = 'block';
}

// Device discovery - check if RD Service is running and device is ready
function discoverDevice(port) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('RDSERVICE', 'http://127.0.0.1:' + port, true);
    xhr.setRequestHeader('Content-Type', 'text/xml; charset=utf-8');
    xhr.timeout = 5000;
    xhr.onload = function() {
      if (xhr.status === 200 && xhr.responseText && xhr.responseText.trim()) {
        try {
          const parser = new DOMParser();
          const xml = parser.parseFromString(xhr.responseText, 'text/xml');
          const rdService = xml.querySelector('RDService');
          if (!rdService) {
            reject(new Error('Invalid RDService response'));
            return;
          }
          const status = rdService.getAttribute('status');
          const info = rdService.getAttribute('info') || '';
          
          // Check if it's a supported device (Mantra, Morpho, etc.)
          const infoLower = info.toLowerCase();
          const isSupported = /mantra/i.test(info) ||
                            infoLower.includes('idemia') ||
                            /secugen india registered device/i.test(info) ||
                            /precision.*biometric device/i.test(info) ||
                            /startek fm220/i.test(info) ||
                            /\bnext\b/i.test(info) ||
                            /face rd/i.test(info);
          
          if (!isSupported) {
            reject(new Error('Unsupported device: ' + info));
            return;
          }
          
          if (status === 'READY') {
            // Find capture method path
            const interfaces = xml.querySelectorAll('Interface');
            let capturePath = '/rd/capture';
            for (let i = 0; i < interfaces.length; i++) {
              const path = interfaces[i].getAttribute('path');
              if (path === '/rd/capture') {
                capturePath = path;
                break;
              }
            }
            resolve({ port, capturePath, deviceInfo: info, status: 'READY' });
          } else if (status === 'NOTREADY') {
            reject(new Error('Device not ready'));
          } else {
            reject(new Error('Unknown device status: ' + status));
          }
        } catch (e) {
          reject(new Error('Failed to parse device info: ' + e.message));
        }
      } else {
        reject(new Error('Empty or invalid response'));
      }
    };
    xhr.onerror = function() { reject(new Error('Connection refused')); };
    xhr.ontimeout = function() { reject(new Error('Request timeout')); };
    xhr.send();
  });
}

// Capture fingerprint from discovered device
function xhrCapture(port, capturePath = '/rd/capture') {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'http://127.0.0.1:' + port + capturePath, true);
    xhr.setRequestHeader('Content-Type', 'text/xml; charset=utf-8');
    xhr.timeout = 12000;
    xhr.onload = function() {
      if (xhr.status === 200 && xhr.responseText && xhr.responseText.trim()) {
        resolve(xhr.responseText);
      } else {
        reject(new Error('Empty or invalid response'));
      }
    };
    xhr.onerror = function() { reject(new Error('Connection refused')); };
    xhr.ontimeout = function() { reject(new Error('Request timeout')); };
    xhr.send(XML_BODY);
  });
}

async function captureFingerprint() {
  const btn = document.getElementById('captureBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Discovering device...';
  showStatus('Searching for Mantra RD Service...', 'info');

  let lastError = '';
  let portsTried = [];
  let deviceFound = null;

  // Step 1: Discover device
  for (const port of PORTS) {
    try {
      showStatus(`Checking port ${port}...`, 'info');
      const device = await discoverDevice(port);
      deviceFound = device;
      portsTried.push(`${port}:READY`);
      showStatus(`✅ Device found on port ${port}: ${device.deviceInfo}`, 'success');
      break;
    } catch (e) {
      lastError = e.message;
      portsTried.push(`${port}:${e.message}`);
      console.log(`Port ${port} discovery failed: ${e.message}`);
    }
  }

  if (!deviceFound) {
    // Device discovery failed
    showStatus(
      '❌ <strong>Cannot Connect to Mantra RD Service</strong><br><br>' +
      '<strong>Fix these issues:</strong><br><br>' +
      '1️⃣ <strong>Mantra device connected?</strong><br>' +
      '   → Plug MFS100 scanner into USB port<br>' +
      '   → Check if device LED is on<br><br>' +
      '2️⃣ <strong>RD Service running?</strong><br>' +
      '   → Look for Mantra icon in system tray (bottom-right)<br>' +
      '   → If not there, run MantraRDService.exe<br>' +
      '   → <strong>Right-click → Run as Administrator</strong><br><br>' +
      '3️⃣ <strong>Just installed?</strong><br>' +
      '   → Restart MantraRDService.exe<br>' +
      '   → Unplug and replug the device<br><br>' +
      '4️⃣ <strong>Still not working?</strong><br>' +
      '   → Restart your computer<br>' +
      '   → Reinstall Mantra RD Service<br>' +
      '   → Download from: <a href="https://www.mantratec.com/RD-Service" target="_blank" style="color:#2563eb;font-weight:bold">mantratec.com</a><br><br>' +
      '<small style="color:#64748b">Ports tried: ' + portsTried.join(', ') + '<br>' +
      'Last error: ' + lastError + '</small>',
      'error'
    );
    btn.disabled = false;
    btn.innerHTML = 'Retry Capture';
    return;
  }

  // Step 2: Capture fingerprint from discovered device
  btn.innerHTML = '<span class="spinner"></span>Scanning...';
  showStatus('Place finger on device and hold steady...', 'info');

  try {
    const xmlText = await xhrCapture(deviceFound.port, deviceFound.capturePath);
    
    const parser = new DOMParser();
    const xml = parser.parseFromString(xmlText, 'text/xml');
    const resp = xml.querySelector('Resp');
    
    if (!resp) {
      throw new Error('Invalid XML response from capture');
    }
    
    const errCode = resp.getAttribute('errCode');
    const errInfo = resp.getAttribute('errInfo') || '';
    
    if (errCode === '0' || errCode === null || errCode === undefined) {
      // SUCCESS - Fingerprint captured
      const pidData = btoa(unescape(encodeURIComponent(xmlText)));
      showStatus('✅ Fingerprint captured successfully!', 'success');
      btn.innerHTML = '✅ Captured!';

      if (window.opener) {
        window.opener.postMessage({ type: 'MANTRA_PID_DATA', pidData: pidData }, '*');
        setTimeout(() => window.close(), 1500);
      } else {
        showStatus('✅ Captured! Close this window and return to main page.', 'success');
      }
      return;
    } else {
      // Device error - finger not placed properly, quality issue, etc.
      showStatus(
        `❌ Device Error (Code ${errCode})<br><br>` +
        `<strong>${errInfo}</strong><br><br>` +
        `Common issues:<br>` +
        `• Finger not placed firmly on scanner<br>` +
        `• Finger is too dry or too wet<br>` +
        `• Scanner surface is dirty<br>` +
        `• Wrong finger (use index finger)<br><br>` +
        `Clean the scanner and try again.`,
        'error'
      );
      btn.disabled = false;
      btn.innerHTML = 'Retry Capture';
      return;
    }
  } catch (e) {
    showStatus(
      `❌ Capture failed: ${e.message}<br><br>` +
      `Try again or check if device is still connected.`,
      'error'
    );
    btn.disabled = false;
    btn.innerHTML = 'Retry Capture';
  }
}

window.onload = function() {
  if (window.opener) {
    window.opener.postMessage({ type: 'MANTRA_WINDOW_READY' }, '*');
  }
};
</script>
</body>
</html>
