server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 30MB
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  mvc:
    async:
      request-timeout: 60000

spring:
  application:
    name: rupiksha-backend-java
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    lazy-initialization: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rupiksha}?sslmode=require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:4}
      minimum-idle: ${DB_POOL_MIN:1}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:#{null}}
      timeout: 3s
      ssl:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.rupiksha.backend: INFO

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}

app:
  jwt:
    issuer: rupiksha
    secret: ${JWT_SECRET:change_this_to_a_long_random_secret_32_chars_min}
    access-token-minutes: ${JWT_ACCESS_MINUTES:480}
    refresh-token-days: ${JWT_REFRESH_DAYS:15}
  otp:
    ttl-seconds: ${OTP_TTL_SECONDS:300}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://rupiksha.in,https://www.rupiksha.in}
  providers:
    otp:
      name: ${OTP_PROVIDER:dovesoft}
      base-url: ${DOVESOFT_BASE_URL:${OTP_BASE_URL:https://api.dovesoft.io}}
      api-key: ${DOVESOFT_API_KEY:${OTP_API_KEY:}}
      sender-id: ${OTP_SENDER_ID:}
    payment:
      name: ${PAYMENT_PROVIDER:mock}
      base-url: ${PAYMENT_BASE_URL:}
      key-id: ${RAZORPAY_KEY_ID:${PAYMENT_KEY_ID:}}
      key-secret: ${RAZORPAY_KEY_SECRET:${PAYMENT_KEY_SECRET:}}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:${PAYMENT_WEBHOOK_SECRET:}}
  recharge:
    provider: ${RECHARGE_PROVIDER:venus}
    base-url: ${RECHARGE_BASE_URL:}
    api-key: ${RECHARGE_API_KEY:}
    api-secret: ${RECHARGE_API_SECRET:}
  venus-recharge:
    base-url: ${VENUS_RECHARGE_BASE_URL:http://api.venusrecharge.com/V2}
    auth-key: ${VENUS_RECHARGE_AUTH_KEY:}
    auth-pass: ${VENUS_RECHARGE_AUTH_PASS:}
    operators:
      - name: "Airtel Live"
        operatorCode: "ACL"
        commission: 0.60
      - name: "AIRTEL"
        operatorCode: "ATL"
        commission: 1.50
      - name: "BSNL TOPUP"
        operatorCode: "BNT"
        commission: 3.90
      - name: "BSNL VALIDITY"
        operatorCode: "BNV"
        commission: 0.00
      - name: "JIO RECHARGE"
        operatorCode: "JRE"
        commission: 0.75
      - name: "JIO TOPUP"
        operatorCode: "JTU"
        commission: 0.00
      - name: "VIDEOCON TOPUP"
        operatorCode: "VCT"
        commission: 0.00
      - name: "VIDEOCON VALIDITY"
        operatorCode: "VCV"
        commission: 0.00
      - name: "VODAFONE"
        operatorCode: "VDF"
        commission: 3.80
  bbps:
    provider: ${BBPS_PROVIDER:billavenue}
    base-url: ${BBPS_BASE_URL:https://stgapi.billavenue.com/billpay}
    api-key: ${BBPS_API_KEY:}
    api-secret: ${BBPS_API_SECRET:}

billavenue:
  base-url: ${BILLAVENUE_BASE_URL:https://stgapi.billavenue.com/billpay}
  access-code: ${BILLAVENUE_ACCESS_CODE:}
  working-key: ${BILLAVENUE_WORKING_KEY:}
  institute-id: ${BILLAVENUE_INSTITUTE_ID:CC01}
  agent-id: ${BILLAVENUE_AGENT_ID:CC01BP66AGTU00000001}
  init-channel: ${BILLAVENUE_INIT_CHANNEL:AGT}
  payment-mode: ${BILLAVENUE_PAYMENT_MODE:Cash}
  aes-iv: ${BILLAVENUE_AES_IV:}
  timeout-seconds: ${BILLAVENUE_TIMEOUT_SECONDS:60}
  biller:
    jio: ${BILLAVENUE_BILLER_JIO:BILAVJIO000001}
    airtel: ${BILLAVENUE_BILLER_AIRTEL:BILAVAIRTEL001}
    vi: ${BILLAVENUE_BILLER_VI:VODA00000NAT01}
    bsnl: ${BILLAVENUE_BILLER_BSNL:BSNL00000NATHL}
    mtnl: ${BILLAVENUE_BILLER_MTNL:MTNL00000DEL01}

  services:
    # Note: Legacy AEPS provider config removed. Using Levin AEPS only.
    aeps-enabled: ${SERVICE_AEPS_ENABLED:true}
    bbps-enabled: ${SERVICE_BBPS_ENABLED:true}
    tickets-enabled: ${SERVICE_TICKETS_ENABLED:true}
    recharge-enabled: ${SERVICE_RECHARGE_ENABLED:true}
    payout-enabled: ${SERVICE_PAYOUT_ENABLED:true}

dovesoft:
  base-url: ${DOVESOFT_BASE_URL:https://api.dovesoft.io}
  api-key: ${DOVESOFT_API_KEY:${OTP_API_KEY:}}
  entity-id: ${DOVESOFT_ENTITY_ID:${OTP_ENTITY_ID:${TWOFACTOR_PEID:${OTP_PEID:}}}}
  temp-id: ${DOVESOFT_TEMP_ID:${OTP_TEMP_ID:${TWOFACTOR_CTID:${OTP_CTID:1707176432251139080}}}}
  sender-id: ${DOVESOFT_SENDER_ID:${OTP_SENDER_ID:${TWOFACTOR_SENDER_ID:RUPIKS}}}
  timetoalive: ${DOVESOFT_TTL:${OTP_TTL_SECONDS:200}}
  message: ${DOVESOFT_OTP_MESSAGE:}

twofactor:
  api-key: ${TWOFACTOR_API_KEY:${OTP_API_KEY:2f056347-ce8a-11f0-a6b2-0200cd936042}}

# Bustto / BuckBox Payout Configuration
bustto:
  payout:
    base-url: ${BUSTTO_BASE_URL:https://admin.bustto.com}
    api-key: ${BUSTTO_API_KEY:${QUICKZAPS_API_KEY:}}
    jwt-secret: ${BUSTTO_JWT_SECRET:${BUSTTO_SECRET_KEY:}}
    aes-key: ${BUSTTO_AES_KEY:${BUSTTO_ENCRYPTION_KEY:}}
    merchant-id: ${BUSTTO_MERCHANT_ID:}
    merchant-name: ${BUSTTO_MERCHANT_NAME:}
    merchant-email: ${BUSTTO_MERCHANT_EMAIL:}
    payout-url: ${BUSTTO_PAYOUT_URL:/api/merchant/external/payout/}
    status-url: ${BUSTTO_STATUS_URL:/api/merchant/external/payout-status/}
    penny-less-url: ${BUSTTO_PENNY_LESS_URL:/api/merchant/external/v1/bank-verification/penny-less}
    penny-drop-url: ${BUSTTO_PENNY_DROP_URL:/api/merchant/external/v1/bank-verification/penny-drop}
    enabled: ${SERVICE_PAYOUT_ENABLED:true}
    encryption-enabled: ${BUSTTO_ENCRYPTION_ENABLED:true}

# AEPS Enterprise Foundation Configuration
aeps:
  active-provider: ${AEPS_ACTIVE_PROVIDER:levin}
  timeout:
    connect: ${AEPS_TIMEOUT_CONNECT:30000}
    read: ${AEPS_TIMEOUT_READ:30000}
  retry:
    max-attempts: ${AEPS_RETRY_MAX_ATTEMPTS:3}
    backoff-ms: ${AEPS_RETRY_BACKOFF_MS:1000}
  providers:
    levin:
      base-url: ${LEVIN_AEPS_BASE_URL:https://api.levinfintech.com/api/levin/v9}
      api-token: ${LEVIN_AEPS_API_TOKEN:}
      user-id: ${LEVIN_AEPS_USER_ID:}
      encryption-key: ${LEVIN_AEPS_ENCRYPTION_KEY:}
    fingpay:
      base-url: ${FINGPAY_AEPS_BASE_URL:https://fingpayap.tapits.in}

fingpay:
