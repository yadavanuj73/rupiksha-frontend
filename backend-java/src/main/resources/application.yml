server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 30MB
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  mvc:
    async:
      request-timeout: 60000

spring:
  application:
    name: rupiksha-backend-java
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    lazy-initialization: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rupiksha}?sslmode=require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:4}
      minimum-idle: ${DB_POOL_MIN:1}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:#{null}}
      timeout: 3s
      ssl:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.rupiksha.backend: INFO

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}

app:
  jwt:
    issuer: rupiksha
    secret: ${JWT_SECRET:change_this_to_a_long_random_secret_32_chars_min}
    access-token-minutes: ${JWT_ACCESS_MINUTES:480}
    refresh-token-days: ${JWT_REFRESH_DAYS:15}
  otp:
    ttl-seconds: ${OTP_TTL_SECONDS:300}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://rupiksha.in,https://www.rupiksha.in}
  providers:
    otp:
      name: ${OTP_PROVIDER:mock}
      base-url: ${OTP_BASE_URL:}
      api-key: ${TWOFACTOR_API_KEY:${OTP_API_KEY:2f056347-ce8a-11f0-a6b2-0200cd936042}}
      sender-id: ${OTP_SENDER_ID:}
    payment:
      name: ${PAYMENT_PROVIDER:mock}
      base-url: ${PAYMENT_BASE_URL:}
      key-id: ${PAYMENT_KEY_ID:}
      key-secret: ${PAYMENT_KEY_SECRET:}
      webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
  recharge:
    provider: ${RECHARGE_PROVIDER:mock}
    base-url: ${RECHARGE_BASE_URL:}
    api-key: ${RECHARGE_API_KEY:}
    api-secret: ${RECHARGE_API_SECRET:}
  venus-recharge:
    base-url: ${VENUS_RECHARGE_BASE_URL:http://api.venusrecharge.com/V2}
    auth-key: ${VENUS_RECHARGE_AUTH_KEY:}
    auth-pass: ${VENUS_RECHARGE_AUTH_PASS:}
    operators:
      - name: "Airtel Live"
        operatorCode: "ACL"
        commission: 0.60
      - name: "AIRTEL"
        operatorCode: "ATL"
        commission: 1.50
      - name: "BSNL TOPUP"
        operatorCode: "BNT"
        commission: 3.90
      - name: "BSNL VALIDITY"
        operatorCode: "BNV"
        commission: 0.00
      - name: "JIO RECHARGE"
        operatorCode: "JRE"
        commission: 0.75
      - name: "JIO TOPUP"
        operatorCode: "JTU"
        commission: 0.00
      - name: "VIDEOCON TOPUP"
        operatorCode: "VCT"
        commission: 0.00
      - name: "VIDEOCON VALIDITY"
        operatorCode: "VCV"
        commission: 0.00
      - name: "VODAFONE"
        operatorCode: "VDF"
        commission: 3.80
  bbps:
    provider: ${BBPS_PROVIDER:mock}
    base-url: ${BBPS_BASE_URL:}
    api-key: ${BBPS_API_KEY:}
    api-secret: ${BBPS_API_SECRET:}
  services:
    # Note: Legacy AEPS provider config removed. Using Levin AEPS only.
    aeps-enabled: ${SERVICE_AEPS_ENABLED:true}
    bbps-enabled: ${SERVICE_BBPS_ENABLED:true}
    tickets-enabled: ${SERVICE_TICKETS_ENABLED:true}
    recharge-enabled: ${SERVICE_RECHARGE_ENABLED:true}
    payout-enabled: ${SERVICE_PAYOUT_ENABLED:true}

twofactor:
  api-key: ${TWOFACTOR_API_KEY:${OTP_API_KEY:2f056347-ce8a-11f0-a6b2-0200cd936042}}

# QuickZaps Payout Configuration
quickzaps:
  payout:
    base-url: ${QUICKZAPS_BASE_URL:http://login.quickzaps.io}
    api-key: ${QUICKZAPS_API_KEY:f43a15b7-1048-4ce8-b1d1-5fcb70c80230}
    payout-url: ${QUICKZAPS_PAYOUT_URL:https://login.quickzaps.io/api/PayoutApi/Payoutinitiate}

# AEPS Enterprise Foundation Configuration
aeps:
  active-provider: ${AEPS_ACTIVE_PROVIDER:levin}
  timeout:
    connect: ${AEPS_TIMEOUT_CONNECT:30000}
    read: ${AEPS_TIMEOUT_READ:30000}
  retry:
    max-attempts: ${AEPS_RETRY_MAX_ATTEMPTS:3}
    backoff-ms: ${AEPS_RETRY_BACKOFF_MS:1000}
  providers:
    levin:
      base-url: ${LEVIN_AEPS_BASE_URL:https://api.levinfintech.com/api/levin/v9}
      api-token: ${LEVIN_AEPS_API_TOKEN:}
      user-id: ${LEVIN_AEPS_USER_ID:}
      encryption-key: ${LEVIN_AEPS_ENCRYPTION_KEY:}
    fingpay:
      base-url: ${FINGPAY_AEPS_BASE_URL:https://fpuat.tapits.in}

fingpay:
  base:
    url: ${FINGPAY_BASE_URL:}
    url-uat: ${FINGPAY_BASE_URL_UAT:}
  username: ${FINGPAY_USERNAME:}
  password: ${FINGPAY_PASSWORD:}
  supermerchant:
    id: ${FINGPAY_SUPERMERCHANT_ID:}
  device:
    imei: ${FINGPAY_DEVICE_IMEI:}
  api:
    secret: ${FINGPAY_API_SECRET:}
  public:
    key:
      path: ${FINGPAY_PUBLIC_KEY_PATH:classpath:fingpay.cer}
  ip: ${FINGPAY_IP:}
  onboard:
    url: ${FINGPAY_ONBOARD_URL:}
  ekyc:
    url: ${FINGPAY_EKYC_URL:}
    validate:
      url: ${FINGPAY_EKYC_VALIDATE_URL:}
    resend:
      url: ${FINGPAY_EKYC_RESEND_URL:}
    biometric:
      url: ${FINGPAY_EKYC_BIOMETRIC_URL:}
    status:
      url: ${FINGPAY_EKYC_STATUS_URL:}
  bank-sync:
    url: ${FINGPAY_BANK_SYNC_URL:}
  cw:
    url: ${FINGPAY_CW_URL:}
    status:
      url: ${FINGPAY_CW_STATUS_URL:}
  bi:
    url: ${FINGPAY_BI_URL:}
  ms:
    url: ${FINGPAY_MS_URL:}
  ap:
    url: ${FINGPAY_AP_URL:}
    status:
      url: ${FINGPAY_AP_STATUS_URL:}

---
# Production profile overrides. Activated with SPRING_PROFILES_ACTIVE=prod.
# All secrets MUST be provided via environment variables - no dev-friendly defaults.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/rupiksha}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    properties:
      hibernate:
        format_sql: false
        show_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: WARN
    com.rupiksha.backend: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: OFF

