version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rupiksha-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-rupiksha}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rupiksha-backend
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-rupiksha}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-Admin@Rupiksha2025}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://rupiksha.in,https://www.rupiksha.in}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://rupiksha.in}
      LEVIN_AEPS_API_TOKEN: ${LEVIN_AEPS_API_TOKEN:-}
      LEVIN_AEPS_USER_ID: ${LEVIN_AEPS_USER_ID:-276}
      LEVIN_AEPS_ENCRYPTION_KEY: ${LEVIN_AEPS_ENCRYPTION_KEY:-}
      LEVIN_AEPS_BASE_URL: ${LEVIN_AEPS_BASE_URL:-https://api.levinfintech.com/api/levin/v9}
      TWOFACTOR_API_KEY: ${TWOFACTOR_API_KEY:-}
      OTP_PROVIDER: ${OTP_PROVIDER:-twofactor}
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
      REDIS_HOST: localhost
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: rupiksha-web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx.ec2.conf:/etc/nginx/conf.d/default.conf:ro
      - ../dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  pgdata:
