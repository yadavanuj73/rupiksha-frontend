name: 100% Google Cloud Deployment (Frontend + Backend)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  backend-cloud-run:
    name: Deploy Backend to GCP Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for GCP Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build & Push Docker Image
        run: |
          docker build \
            -t asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rupiksha-repo/backend-java:${{ github.sha }} \
            -t asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rupiksha-repo/backend-java:latest \
            ./backend-java
          docker push asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rupiksha-repo/backend-java:${{ github.sha }}
          docker push asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rupiksha-repo/backend-java:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy rupiksha-backend-java \
            --image asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rupiksha-repo/backend-java:${{ github.sha }} \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "SPRING_PROFILES_ACTIVE=prod,MANAGEMENT_HEALTH_REDIS_ENABLED=false"

  frontend-firebase:
    name: Deploy Frontend to GCP Firebase Hosting
    runs-on: ubuntu-latest
    needs: backend-cloud-run
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build React Application
        env:
          VITE_API_URL: ${{ secrets.GCP_BACKEND_URL }}
          VITE_BACKEND_URL: ${{ secrets.GCP_BACKEND_URL }}
        run: npm run build

      - name: Deploy to Firebase Hosting (GCP)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          channelId: live
          projectId: ${{ secrets.GCP_PROJECT_ID }}
