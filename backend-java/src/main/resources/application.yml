server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 10MB

spring:
  application:
    name: rupiksha-backend-java
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rupiksha}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.rupiksha.backend: INFO

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}

app:
  jwt:
    issuer: rupiksha
    secret: ${JWT_SECRET:change_this_to_a_long_random_secret_32_chars_min}
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:15}
  otp:
    ttl-seconds: ${OTP_TTL_SECONDS:300}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  providers:
    otp:
      name: ${OTP_PROVIDER:mock}
      base-url: ${OTP_BASE_URL:}
      api-key: ${OTP_API_KEY:}
      sender-id: ${OTP_SENDER_ID:}
    payment:
      name: ${PAYMENT_PROVIDER:mock}
      base-url: ${PAYMENT_BASE_URL:}
      key-id: ${PAYMENT_KEY_ID:}
      key-secret: ${PAYMENT_KEY_SECRET:}
      webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
  recharge:
    provider: ${RECHARGE_PROVIDER:mock}
    base-url: ${RECHARGE_BASE_URL:}
    api-key: ${RECHARGE_API_KEY:}
    api-secret: ${RECHARGE_API_SECRET:}
  aeps:
    provider: ${AEPS_PROVIDER:mock}
    base-url: ${AEPS_BASE_URL:}
    api-key: ${AEPS_API_KEY:}
    api-secret: ${AEPS_API_SECRET:}
  bbps:
    provider: ${BBPS_PROVIDER:mock}
    base-url: ${BBPS_BASE_URL:}
    api-key: ${BBPS_API_KEY:}
    api-secret: ${BBPS_API_SECRET:}
  services:
    aeps-enabled: ${SERVICE_AEPS_ENABLED:true}
    bbps-enabled: ${SERVICE_BBPS_ENABLED:true}
    tickets-enabled: ${SERVICE_TICKETS_ENABLED:true}
    recharge-enabled: ${SERVICE_RECHARGE_ENABLED:true}
    payout-enabled: ${SERVICE_PAYOUT_ENABLED:true}

levin:
  aeps:
    base-url: https://api.levinfintech.com/api/levin
    api-token: your_api_token_here
    user-id: your_user_id_here
    encryption-key: your_encryption_key_here
  environment:
    allow-mock-providers-in-production: ${ALLOW_MOCK_PROVIDERS_IN_PRODUCTION:false}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}

---
# Production profile overrides. Activated with SPRING_PROFILES_ACTIVE=prod.
# All secrets MUST be provided via environment variables - no dev-friendly defaults.
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    properties:
      hibernate:
        format_sql: false
        show_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: WARN
    com.rupiksha.backend: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: OFF

