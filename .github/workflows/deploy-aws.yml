name: Build & Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Java Spring Boot Backend
        run: |
          cd backend-java
          mvn -DskipTests clean package

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build React Frontend
        run: |
          npm ci
          npm run build

      - name: Deploy Artifacts to AWS EC2 via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*,backend-java/target/backend-java-0.0.1-SNAPSHOT.jar,aws/deploy-ec2.sh"
          target: "/tmp/deploy-payload"
          strip_components: 0

      - name: Execute Remote Deployment Script on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /tmp/frontend-dist /tmp/backend-jar
            sudo cp -r /tmp/deploy-payload/dist/* /tmp/frontend-dist/
            sudo cp /tmp/deploy-payload/backend-java/target/backend-java-0.0.1-SNAPSHOT.jar /tmp/backend-jar/
            sudo chmod +x /tmp/deploy-payload/aws/deploy-ec2.sh
            sudo /tmp/deploy-payload/aws/deploy-ec2.sh
            sudo rm -rf /tmp/deploy-payload /tmp/frontend-dist /tmp/backend-jar
